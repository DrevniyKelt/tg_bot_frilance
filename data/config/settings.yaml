app:
  name: SkillLane
  brand_tagline: IT freelance exchange for Telegram and web
  secret_key: dev-secret-change-me
  default_locale: ru
  base_url: http://127.0.0.1:8000

database:
  url: sqlite+aiosqlite:///./data/skilllane.db
  echo: false

telegram:
  bot_token: ""
  allow_dev_login: true

demo:
  seed_data: true
  default_user_id: 1

features:
  fee_mode: deduct
  fee_percent: 0.01
  require_tariff_after_first_completed: true
  new_user_max_orders: 5
  new_user_max_applications: 100
  new_user_max_matches: 3
  new_user_max_unmatched_applications_per_week: 50
  swipe_min_similarity: 0.5
  swipe_mix_strategy: mixed
