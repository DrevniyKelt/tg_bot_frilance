[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "skilllane"
version = "0.1.0"
description = "FastAPI/Jinja2 closed-beta MVP for an IT freelance marketplace."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.20.0",
  "aiogram>=3.26.0",
  "fastapi>=0.115.12",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "python-slugify>=8.0.4",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.34.0",
]

[tool.poetry]
packages = [{ include = "app" }]
include = [
  { path = "app/static", format = ["sdist", "wheel"] },
  { path = "app/templates", format = ["sdist", "wheel"] },
  { path = "data/config", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q --basetemp=.pytest_temp"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28.1"
pytest = ">=8.3.5"
pytest-cov = "^7.0.0"
