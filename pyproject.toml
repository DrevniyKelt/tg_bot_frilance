[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllane"
version = "0.1.0"
description = "FastAPI/Jinja2 closed-beta MVP for an IT freelance marketplace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.12",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "python-slugify>=8.0.4",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
